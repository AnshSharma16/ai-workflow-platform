services:
  db:
    image: postgres:16
    container_name: workflow_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_workflow_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: